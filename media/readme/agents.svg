<style>
.sw{animation:sw 5s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-360px) skewX(-20deg)}70%,100%{transform:translateX(1300px) skewX(-20deg)}}
.gl{opacity:0.15;animation:gl 7s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:0.15}7%{opacity:0.9}18%{opacity:0.15}}
.dot{animation:dot 1.4s steps(2,start) infinite}
@keyframes dot{50%{opacity:0.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
