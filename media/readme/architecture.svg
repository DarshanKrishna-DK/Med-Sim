<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">MedSim architecture</title>
<desc id="d">Browser talks to Agora RTC and RTM and the Agora Conversational AI Engine (Sarvam ASR, Sarvam or Groq LLM through the MedSim custom LLM route, Murf Falcon TTS). The browser also calls the FastAPI backend, which runs the nurse and other agents and reaches real-world tools.</desc>
<defs>
<pattern id="px" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#2b4c8a" fill-opacity="0.35"/></pattern>
<filter id="blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8e27c"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffd84d"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7fd3ff"/></marker>
</defs>
<style>
.flow{stroke-dasharray:9 7;animation:flow 0.9s linear infinite}
.rev{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-16}}
.halo{animation:halo 2.6s ease-in-out infinite}
.h2{animation-delay:1.3s}
@keyframes halo{0%,100%{opacity:0.25}50%{opacity:0.85}}
.stage{animation:stage 3s steps(1,end) infinite}
.s2{animation-delay:1s}.s3{animation-delay:2s}
@keyframes stage{0%{fill-opacity:0.32}33%{fill-opacity:0.08}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
