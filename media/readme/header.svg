<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">MedSim</title>
<desc id="d">MedSim, the voice-first clinical simulator. Talk to AI patients, speak your orders, an AI nurse acts.</desc>
<defs>
<pattern id="px" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#2b4c8a" fill-opacity="0.35"/></pattern>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
<radialGradient id="halo" cx="0.25" cy="0.35" r="0.6"><stop offset="0" stop-color="#2b4c8a" stop-opacity="0.55"/><stop offset="1" stop-color="#061431" stop-opacity="0"/></radialGradient>
</defs>
<style>
.comet{stroke-dasharray:0.16 0.84;animation:run 7s linear infinite}
@keyframes run{to{stroke-dashoffset:-1}}
.draw{stroke-dasharray:1;animation:draw 4s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:1;opacity:1}62%{stroke-dashoffset:0;opacity:1}88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0.15}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.18)}28%{transform:scale(0.96)}42%{transform:scale(1.1)}}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0.2}}
.pulse{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.35}50%{opacity:0.9}}
.glowtxt{animation:gt 3.2s ease-in-out infinite}
@keyframes gt{0%,100%{opacity:0.25}50%{opacity:0.75}}
.chip{animation:chip 4.5s ease-in-out infinite}
.c2{animation-delay:1.5s}.c3{animation-delay:3s}
@keyframes chip{0%,100%{stroke-opacity:0.45}20%{stroke-opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="300" rx="18" fill="#061431"/><rect width="1200" height="300" rx="18" fill="url(#px)"/><rect x="1.5" y="1.5" width="1197" height="297" rx="17" fill="none" stroke="#173571" stroke-width="3"/>
